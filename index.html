<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loomline Factory Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: sticky run bar with a day scrubber over a settings rail and a tabbed workspace.
   Palette: denim-indigo accent on blue-biased neutrals; chart hues come from the validated categorical set. */
:root {
  --bg: #f2f4f9; --surface: #ffffff; --surface-2: #f7f8fc; --ink: #141a2b; --ink-2: #444e66; --ink-3: #66708c;
  --line: #dfe3ed; --line-2: #ecf0f6; --accent: #2b4a9a; --accent-ink: #ffffff; --accent-soft: #e6ebf8;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #6250d6;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b;
  --p-good-fg: #0b6b0b; --p-good-bg: #e0f2e0; --p-warn-fg: #7a5200; --p-warn-bg: #fdefc9;
  --p-crit-fg: #a52a2a; --p-crit-bg: #fbe3e3; --p-info-fg: #2b4a9a; --p-info-bg: #e6ebf8; --p-neu-fg: #444e66; --p-neu-bg: #eaedf4;
  --shadow: 0 1px 2px rgba(20,26,43,.05), 0 6px 18px rgba(20,26,43,.05);
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220; --surface: #161b2c; --surface-2: #1b2136; --ink: #eceef6; --ink-2: #b6bcd0; --ink-3: #8f97ae;
    --line: #272e46; --line-2: #202740; --accent: #8aa4f2; --accent-ink: #0e1220; --accent-soft: #212c52;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
    --p-good-fg: #5ed05e; --p-good-bg: #14301a; --p-warn-fg: #f3c04b; --p-warn-bg: #3a2d0c;
    --p-crit-fg: #ff8f8f; --p-crit-bg: #401919; --p-info-fg: #a3b6f6; --p-info-bg: #212c52; --p-neu-fg: #b6bcd0; --p-neu-bg: #252c44;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #161b2c; --surface-2: #1b2136; --ink: #eceef6; --ink-2: #b6bcd0; --ink-3: #8f97ae;
  --line: #272e46; --line-2: #202740; --accent: #8aa4f2; --accent-ink: #0e1220; --accent-soft: #212c52;
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #9085e9;
  --p-good-fg: #5ed05e; --p-good-bg: #14301a; --p-warn-fg: #f3c04b; --p-warn-bg: #3a2d0c;
  --p-crit-fg: #ff8f8f; --p-crit-bg: #401919; --p-info-fg: #a3b6f6; --p-info-bg: #212c52; --p-neu-fg: #b6bcd0; --p-neu-bg: #252c44;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 30; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* run bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-row { display: flex; align-items: center; gap: 12px; padding-block: 10px 6px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand b { font-size: 17px; font-weight: 700; letter-spacing: -.01em; display: block; line-height: 1.1; }
.brand span { color: var(--ink-3); font-size: 12px; }
.demo-chip { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 6px; background: var(--p-warn-bg); color: var(--p-warn-fg); }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 550; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.only-m { display: none; }
.scrub { display: flex; align-items: center; gap: 12px; padding-block: 4px 10px; }
.play { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.play svg { width: 14px; height: 14px; fill: currentColor; }
.scrub input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); height: 28px; }
.scrub-label { text-align: right; min-width: 118px; line-height: 1.2; }
.scrub-label b { display: block; font-size: 14px; font-variant-numeric: tabular-nums; }
.scrub-label span { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }

/* layout */
.layout { display: grid; grid-template-columns: 296px minmax(0, 1fr); gap: 20px; padding-block: 18px 40px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 112px); max-height: calc(100vh - 130px); overflow: auto; }
.panel h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin: 18px 0 8px; font-weight: 650; }
.panel h2:first-child { margin-top: 0; }
.presets { display: flex; flex-direction: column; gap: 6px; }
.preset { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; }
.preset small { display: block; color: var(--ink-3); font-size: 12px; line-height: 1.3; margin-top: 1px; }
.preset[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
.preset b { font-weight: 600; }
.ctl { margin: 10px 0 12px; }
.ctl-h { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.ctl-h output { font-variant-numeric: tabular-nums; color: var(--ink-2); font-weight: 600; }
.ctl input[type=range] { width: 100%; accent-color: var(--accent); margin: 2px 0 0; }
.sel, .num { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; }
.row2 { display: flex; gap: 8px; }
.note { color: var(--ink-3); font-size: 12px; margin-top: 6px; }

/* tabs */
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); margin-bottom: 16px; scrollbar-width: thin; }
.tab { border: 0; background: none; padding: 10px 14px; color: var(--ink-3); font-weight: 600; border-bottom: 2px solid transparent; white-space: nowrap; margin-bottom: -1px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected=true] { color: var(--ink); border-bottom-color: var(--accent); }

/* cards and tiles */
.stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.card h3 { font-size: 14px; font-weight: 650; margin: 0; }
.card .sub { color: var(--ink-3); font-size: 12px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px 12px; min-width: 0; }
.kpi label { display: block; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.kpi .v { white-space: nowrap; font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin: 4px 0 2px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--ink-3); }
.dl { display: inline-block; font-size: 12px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.dl.good { color: var(--p-good-fg); } .dl.bad { color: var(--p-crit-fg); } .dl.neu { color: var(--ink-2); }

/* factory flow */
.flow { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px; }
.cell { border: 1px solid var(--line); border-radius: 10px; padding: 11px; background: var(--surface-2); min-width: 0; position: relative; }
.cell:not(:last-child)::after { content: '\203A'; position: absolute; right: -12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 22px; font-weight: 700; line-height: 1; pointer-events: none; }
.cell.hot { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.cell .nm { font-size: 12px; font-weight: 650; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 6px; }
.cell .nm em { font-style: normal; font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.cell .big { font-size: 19px; font-weight: 650; margin: 6px 0 0; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.cell .big small { display: block; font-size: 12px; color: var(--ink-3); font-weight: 500; letter-spacing: 0; margin-top: 1px; }
.cell .sm { font-size: 12px; color: var(--ink-3); margin: 2px 0 8px; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-bottom: 8px; }
.bar i { display: block; height: 100%; border-radius: 3px; }

/* pills and chips */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--p-good-bg); color: var(--p-good-fg); } .pill.warn { background: var(--p-warn-bg); color: var(--p-warn-fg); }
.pill.crit { background: var(--p-crit-bg); color: var(--p-crit-fg); } .pill.info { background: var(--p-info-bg); color: var(--p-info-fg); }
.pill.neu { background: var(--p-neu-bg); color: var(--p-neu-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 13px; font-weight: 550; color: var(--ink-2); }
.chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* tables */
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.tbl.tall { max-height: 520px; overflow-y: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; padding: 9px 12px; background: var(--surface-2); position: sticky; top: 0; z-index: 1; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line-2); white-space: nowrap; vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
td.id { font-family: var(--f-mono); font-size: 12px; }
tr.grp td { background: var(--surface-2); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); font-weight: 650; }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 14px; height: 8px; border-radius: 2px; background: var(--line); display: block; }
.dots i.cur { background: transparent; box-shadow: inset 0 0 0 1.5px var(--ink-3); }
.mini { display: inline-block; width: 48px; height: 6px; background: var(--line); border-radius: 3px; vertical-align: middle; margin-right: 8px; overflow: hidden; }
.mini i { display: block; height: 100%; background: var(--accent); }
table.cmp th { white-space: normal; vertical-align: bottom; }
td.best { font-weight: 700; color: var(--accent); }

/* stage cards */
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.stage { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 14px; }
.stage h4 { margin: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.stage h4 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.stage dl { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; margin: 10px 0 0; font-size: 13px; }
.stage dt { color: var(--ink-3); } .stage dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.feed { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.feed li { display: grid; grid-template-columns: 74px auto 1fr; gap: 10px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line-2); }
.feed li:last-child { border-bottom: 0; }
.feed time { color: var(--ink-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.empty { color: var(--ink-3); padding: 12px 0; }

/* charts */
.ch { position: relative; width: 100%; }
.ch svg { display: block; width: 100%; height: auto; overflow: visible; }
.gl { stroke: var(--line-2); stroke-width: 1; }
.base { stroke: var(--line); stroke-width: 1; }
.ax { fill: var(--ink-3); font-size: 11px; font-family: var(--f-body); font-variant-numeric: tabular-nums; }
.axb { fill: var(--ink-2); font-size: 11px; font-weight: 600; font-family: var(--f-body); }
.mk { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 3 3; }
.rf { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 5 4; }
.hv { stroke: var(--ink-3); stroke-width: 1; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow); min-width: 140px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tip i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.tip span { font-variant-numeric: tabular-nums; font-weight: 600; }
.loading { padding: 28px; text-align: center; color: var(--ink-3); }


/* report, data editor, notices */
.demo-chip.custom { background: var(--p-info-bg); color: var(--p-info-fg); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.rng { font-size: 11px; color: var(--ink-3); font-weight: 500; }
td.gd { color: var(--p-good-fg); font-weight: 600; } td.bd { color: var(--p-crit-fg); font-weight: 600; }
details.adv { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
details.adv > summary { cursor: pointer; font-weight: 650; color: var(--ink-2); }
details.adv > h2:first-of-type { margin-top: 12px; }
.subnav { margin-bottom: 14px; }
table.wrapc td { white-space: normal; }
tr.tot td { font-weight: 700; border-top: 1px solid var(--line); background: var(--surface-2); }
.finds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.finds li { display: grid; grid-template-columns: 92px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line-2); align-items: start; }
.finds li:last-child { border-bottom: 0; }
.finds p { margin: 2px 0 0; color: var(--ink-2); }
details summary { cursor: pointer; font-weight: 650; }
.doc h4 { margin: 16px 0 6px; font-size: 13px; } .doc ul { margin: 0; padding-left: 20px; color: var(--ink-2); } .doc li { margin: 4px 0; } .doc p { color: var(--ink-2); }
.lead { margin: 0 0 12px; color: var(--ink-2); max-width: 78ch; }
.err { background: var(--p-crit-bg); color: var(--p-crit-fg); border-radius: 8px; padding: 9px 12px; margin-bottom: 12px; font-weight: 600; }
.data td .sub { font-size: 11px; color: var(--ink-3); }
input.ci { width: 112px; padding: 5px 8px; text-align: right; font-variant-numeric: tabular-nums; }
input.ci.txt { width: 190px; text-align: left; }
textarea.num { font: inherit; resize: vertical; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; box-shadow: var(--shadow); font-weight: 600; max-width: min(92vw, 520px); }
.toast.bad { background: var(--crit); color: #fff; }
.toast[hidden] { display: none; }
@media print {
  body { background: #fff; }
  .top, .panel, .tabs, .no-print, .toast, body::before { display: none !important; }
  .layout { display: block; padding: 0; } .wrap { max-width: none; padding: 0; }
  .card, .kpi { box-shadow: none; break-inside: avoid; }
  .grid2 { grid-template-columns: 1fr 1fr; }
  details { display: block; } details > summary { display: none; }
  .tbl, .tbl.tall { overflow: visible; max-height: none; }
}


/* small screens and wide tables */
.hide-s { }
.swipe-hint { color: var(--ink-3); font-size: 12px; margin: 6px 2px 0; }
.tbl tr { background: var(--surface); }
.tbl table:not(.kv) td:first-child, .tbl table:not(.kv) th:first-child { position: sticky; left: 0; background: inherit; z-index: 2; box-shadow: 1px 0 0 var(--line-2); }
.tbl table:not(.kv) th:first-child { z-index: 3; background: var(--surface-2); }
tr.grp td:first-child { background: var(--surface-2); }
@media (max-width: 720px) {
  table.kv, table.kv tbody, table.kv tr, table.kv td { display: block; width: 100%; }
  table.kv tr { padding: 8px 12px; border-bottom: 1px solid var(--line-2); } table.kv tr:last-child { border-bottom: 0; }
  table.kv td { padding: 2px 0; border: 0; white-space: normal; }
  table.kv input.ci { width: 100%; text-align: left; }
}

@media (max-width: 1200px) {
  .flow { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .cell:not(:last-child)::after { display: none; }
}
@media (max-width: 960px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; display: none; }
  .panel.open { display: block; }
  .only-m { display: inline-flex; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 620px) {
  .flow { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .cell { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'nm pill' 'big big' 'sm sm' 'bar bar'; align-items: center; column-gap: 8px; padding: 12px 14px; }
  .cell .nm { grid-area: nm; justify-content: flex-start; gap: 10px; font-size: 14px; }
  .cell > .pill { grid-area: pill; justify-self: end; }
  .cell .big { grid-area: big; margin: 6px 0 0; }
  .cell .big small { display: inline; margin: 0; }
  .cell .sm { grid-area: sm; margin: 2px 0 8px; }
  .cell .bar { grid-area: bar; margin-bottom: 0; }
  .cell:not(:last-child)::after { display: block; content: '\2193'; right: auto; left: 50%; top: auto; bottom: -24px; height: 24px; transform: translateX(-50%); display: flex; align-items: center; font-size: 18px; }
}
@media (max-width: 520px) {
  .hide-s { display: none; }
  .brand span { display: none; }
  .top-row { gap: 8px; padding-block: 8px 2px; }
  .scrub { padding-block: 2px 8px; }
  .tab { padding: 10px 6px; font-size: 13px; }
  .card { padding: 14px; }
  .actions .btn { flex: 1 1 auto; justify-content: center; }
  .scrub-label { min-width: 96px; }
  .feed li { grid-template-columns: 62px auto; } .feed li > span:last-child { grid-column: 1 / -1; } .feed li .pill { justify-self: start; }
  .kpi .v { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--accent)"/><g stroke="var(--accent-ink)" stroke-width="2.4" stroke-linecap="round"><path d="M7 9h14M7 14h14M7 19h14" opacity=".5"/><path d="M10 6v16M18 6v16"/></g></svg>
        <div><b>Loomline</b><span>Textile factory simulator</span></div>
      </div>
      <span class="demo-chip" id="dataChip">Demo data</span>

      <button class="play" id="play" aria-label="Play simulation"><svg viewBox="0 0 14 14" id="playIcon"><path d="M3 1.5v11l9-5.5z"/></svg></button>

    </div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
/* Loomline simulation engine: daily-step model of a textile factory.
   Orders -> material release (BOM) -> Weaving -> Dyeing -> Finishing -> Packing -> Shipped.
   Raw materials and consumables follow (s,S) replenishment with supplier lead-time variability.
   All randomness is hash-keyed by (seed, stream, day, index) so scenarios share the same demand
   and machine luck (common random numbers) and differences come only from the settings changed. */
(function (root) {
  'use strict';

  /* ---------- Master data (dummy) ---------- */
  const STAGES = [
    { id: 'weave',  name: 'Weaving',   cap: 10800, changeover: 220, conv: 9 },
    { id: 'dye',    name: 'Dyeing',    cap: 10200, changeover: 350, conv: 15 },
    { id: 'finish', name: 'Finishing', cap: 11800, changeover: 120, conv: 6 },
    { id: 'pack',   name: 'Packing',   cap: 12500, changeover: 0,   conv: 2 }
  ];

  const PRODUCTS = [
    { id: 'poplin', name: 'Poplin 40s',        short: 'Poplin',      price: 168, share: 0.30, size: [1500, 5000], lead: 12, bom: { y40: 16.5, starch: 0.8, reac: 0.55 } },
    { id: 'denim',  name: 'Denim 10 oz',       short: 'Denim',       price: 292, share: 0.30, size: [2000, 7000], lead: 15, bom: { y10: 52, starch: 2.5, indigo: 1.6 } },
    { id: 'twill',  name: 'Twill Workwear',    short: 'Twill',       price: 214, share: 0.22, size: [1500, 5500], lead: 13, bom: { y20: 37, starch: 1.8, reac: 1.0 } },
    { id: 'pc',     name: 'Poly-Cotton Blend', short: 'Poly-cotton', price: 142, share: 0.18, size: [1500, 4500], lead: 12, bom: { ypc: 22.5, starch: 1.1, reac: 0.7 } }
  ];

  // kind raw: consumed per 100 m through BOM. kind cons: consumed per 100 m processed at a stage.
  const ITEMS = [
    { id: 'y40',     name: 'Cotton Yarn 40s',      kind: 'raw',  unit: 'kg', cost: 335, lot: 2500,  lt: [6, 1.5],  cover: 9,  supplier: 'Kaveri Yarn Mills' },
    { id: 'y10',     name: 'Cotton Yarn 10s',      kind: 'raw',  unit: 'kg', cost: 248, lot: 6000,  lt: [7, 2],    cover: 9,  supplier: 'Kaveri Yarn Mills' },
    { id: 'y20',     name: 'Cotton Yarn 20s',      kind: 'raw',  unit: 'kg', cost: 272, lot: 4000,  lt: [6, 1.5],  cover: 9,  supplier: 'Aarav Cotton Traders' },
    { id: 'ypc',     name: 'Poly-Cotton Yarn 30s', kind: 'raw',  unit: 'kg', cost: 236, lot: 2500,  lt: [8, 2],    cover: 9,  supplier: 'Aarav Cotton Traders' },
    { id: 'reac',    name: 'Reactive Dye',         kind: 'raw',  unit: 'kg', cost: 640, lot: 300,   lt: [10, 2.5], cover: 14, supplier: 'Coastal Dyes & Intermediates' },
    { id: 'indigo',  name: 'Indigo Dye',           kind: 'raw',  unit: 'kg', cost: 880, lot: 400,   lt: [12, 3],   cover: 14, supplier: 'Coastal Dyes & Intermediates' },
    { id: 'starch',  name: 'Sizing Starch',        kind: 'raw',  unit: 'kg', cost: 52,  lot: 1000,  lt: [5, 1],    cover: 12, supplier: 'ChemSource Pvt Ltd' },
    { id: 'lube',    name: 'Loom Lubricant',       kind: 'cons', unit: 'L',  cost: 215, lot: 200,   lt: [4, 1],    cover: 15, supplier: 'LubeTech Industrial', stage: 0, rate: 0.35 },
    { id: 'caustic', name: 'Caustic Soda',         kind: 'cons', unit: 'kg', cost: 38,  lot: 4000,  lt: [4, 1],    cover: 10, supplier: 'ChemSource Pvt Ltd',  stage: 1, rate: 6.0 },
    { id: 'salt',    name: 'Dyeing Salt',          kind: 'cons', unit: 'kg', cost: 14,  lot: 10000, lt: [5, 1.5],  cover: 10, supplier: 'ChemSource Pvt Ltd',  stage: 1, rate: 14 },
    { id: 'soft',    name: 'Finishing Softener',   kind: 'cons', unit: 'L',  cost: 118, lot: 1500,  lt: [6, 1.5],  cover: 12, supplier: 'FinishChem Co',       stage: 2, rate: 3.2 },
    { id: 'film',    name: 'Packing Film',         kind: 'cons', unit: 'kg', cost: 165, lot: 400,   lt: [5, 1],    cover: 12, supplier: 'PackWell Industries', stage: 3, rate: 0.9 }
  ];
  const IDX = {};
  ITEMS.forEach((it, i) => { it.idx = i; IDX[it.id] = i; });

  const CUSTOMERS = ['Northwind Apparel', 'Bluebell Garments', 'Crestline Uniforms', 'Meridian Fashions', 'Harbor & Pine', 'Sundial Textiles', 'Orchid Export House', 'Vantage Workwear', 'Juniper Denim Co.', 'Lakeshore Home Fabrics'];

  // Global parameters (editable through setData)
  const PARAMS = {
    lambda: 2.1,       // orders per working day at demand 1.0
    holdRate: 0.20,    // yearly carrying cost on inventory value
    poFee: 2500,       // cost per purchase order
    latePenaltyPerDay: 0.01, // share of order value per day late
    latePenaltyCap: 0.15     // maximum penalty share
  };
  const START_DATE = Date.UTC(2026, 10, 2); // Mon 2 Nov 2026 = day 1

  const DEFAULTS = {
    horizon: 90, seed: 7, demand: 1, supplierLT: 1, lateProb: 0.08, safetyDays: 4,
    cap: { weave: 1, dye: 1, finish: 1, pack: 1 }, breakdown: 0.04, rule: 'edd'
  };

  const PRESETS = [
    { id: 'base',   name: 'Baseline',                 desc: 'Normal demand, reliable suppliers.', cfg: {} },
    { id: 'surge',  name: 'Demand surge +25%',        desc: 'Orders arrive 25% faster than planned.', cfg: { demand: 1.25 } },
    { id: 'fix',    name: 'Surge + Dyeing +20%',      desc: 'Same surge, with a dyeing capacity expansion.', cfg: { demand: 1.25, cap: { dye: 1.2 } } },
    { id: 'supply', name: 'Supplier delays',          desc: 'Lead times 50% longer and 20% of deliveries run late.', cfg: { supplierLT: 1.5, lateProb: 0.2 } },
    { id: 'break',  name: 'Machine breakdowns',       desc: 'Breakdowns three times as frequent on every stage.', cfg: { breakdown: 0.12 } },
    { id: 'lean',   name: 'Lean stock',               desc: 'Safety stock cut to one day of cover.', cfg: { safetyDays: 1 } }
  ];

  /* ---------- Random numbers (hash keyed) ---------- */
  function R(seed, k1, k2, k3) {
    let h = (seed ^ 0x9e3779b9) | 0;
    h = Math.imul(h ^ k1, 0x85ebca6b); h ^= h >>> 13;
    h = Math.imul(h ^ k2, 0xc2b2ae35); h ^= h >>> 16;
    h = Math.imul(h ^ k3, 0x27d4eb2f); h ^= h >>> 15;
    h = Math.imul(h, 0x165667b1); h ^= h >>> 13;
    return (h >>> 0) / 4294967296;
  }
  function normal(seed, k1, k2, k3) {
    const u1 = Math.max(1e-9, R(seed, k1, k2, k3)), u2 = R(seed, k1 + 500, k2, k3);
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(2 * Math.PI * u2);
  }
  function poisson(lambda, u) {
    if (lambda > 30) { // normal approximation keeps exp(-lambda) from underflowing for large demand
      const z = Math.sqrt(2) * erfInv(2 * clamp(u, 1e-9, 1 - 1e-9) - 1);
      return Math.max(0, Math.round(lambda + Math.sqrt(lambda) * z));
    }
    let k = 0, p = Math.exp(-lambda), c = p;
    while (u > c && k < 200) { k++; p *= lambda / k; c += p; }
    return k;
  }
  function erfInv(x) { // Giles-style approximation, accurate to ~1e-3 which is plenty for demand counts
    const a = 0.147, ln = Math.log(1 - x * x), t = 2 / (Math.PI * a) + ln / 2;
    return Math.sign(x) * Math.sqrt(Math.sqrt(t * t - ln / a) - t);
  }
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

  /* ---------- Planning parameters ---------- */
  function mergeCfg(u) {
    const c = Object.assign({}, DEFAULTS, u || {});
    c.cap = Object.assign({}, DEFAULTS.cap, (u && u.cap) || {});
    c.horizon = clamp(Math.round(c.horizon), 14, 365);
    return c;
  }

  function makePlan(cfg) {
    const avgSize = PRODUCTS.reduce((a, p) => a + p.share * (p.size[0] + p.size[1]) / 2, 0);
    const mPerCal = PARAMS.lambda * avgSize * 6 / 7;
    return ITEMS.map(it => {
      const use = it.kind === 'raw'
        ? PRODUCTS.reduce((a, p) => a + p.share * mPerCal * (p.bom[it.id] || 0) / 100, 0)
        : mPerCal * it.rate / 100;
      const rop = use * (it.lt[0] + cfg.safetyDays);
      const S = rop + use * it.cover;
      return { use, rop, S, init: rop + use * it.cover * 0.5 };
    });
  }

  function dateOf(day) { return new Date(START_DATE + (day - 1) * 86400000); }
  const isSunday = day => ((day - 1) % 7 + 7) % 7 === 6;

  /* ---------- Simulation ---------- */
  function simulate(userCfg) {
    const cfg = mergeCfg(userCfg), H = cfg.horizon, seed = cfg.seed | 0;
    const plan = makePlan(cfg), nI = ITEMS.length, nS = STAGES.length;
    const onHand = plan.map(p => p.init), onOrder = new Array(nI).fill(0);
    const orders = [], pos = [], events = [], days = [];
    const stg = STAGES.map(() => ({ last: null, down: 0 }));
    const cum = { rev: 0, cogs: 0, mat: 0, conv: 0, cons: 0, hold: 0, ord: 0, pen: 0 };
    let prevShort = new Array(nI).fill(0);
    let soSeq = 10240, poSeq = 4400;
    const invValue = () => onHand.reduce((a, q, i) => a + q * ITEMS[i].cost, 0);
    const ev = (day, sev, type, text) => events.push({ day, sev, type, text });

    function snapshot(t, x) {
      const wip = new Array(nS).fill(0); let awaitM = 0, bookProdM = 0;
      for (const o of orders) {
        if (o.ship !== null) continue;
        if (o.stage === -1) awaitM += o.qty; else { wip[o.stage] += o.rem; bookProdM += o.qty; }
      }
      return Object.assign({
        t, onHand: onHand.slice(), onOrder: onOrder.slice(), invValue: invValue(), wip, awaitM, bookProdM,
        cum: Object.assign({}, cum),
        proc: new Array(nS).fill(0), avail: new Array(nS).fill(0), lost: new Array(nS).fill(0),
        down: new Array(nS).fill(0), starve: new Array(nS).fill(0), short: new Array(nI).fill(0),
        used: new Array(nI).fill(0), arrCnt: 0, arrM: 0, shipCnt: 0, shipM: 0, sunday: t > 0 && isSunday(t)
      }, x || {});
    }
    days.push(snapshot(0));

    function pick(cands, rule, last, t) {
      const byDue = (a, b) => a.due - b.due || a.n - b.n;
      if (rule === 'fifo') return cands.slice().sort((a, b) => a.arrival - b.arrival || a.n - b.n)[0];
      const sorted = cands.slice().sort(byDue);
      if (rule === 'campaign' && last !== null) {
        const urgent = sorted.filter(o => o.due - t <= 2);
        if (urgent.length) return urgent[0];
        const same = sorted.filter(o => o.product === last);
        if (same.length) return same[0];
      }
      return sorted[0];
    }

    for (let t = 1; t <= H; t++) {
      const sunday = isSunday(t);
      const short = new Array(nI).fill(0), used = new Array(nI).fill(0);
      const proc = new Array(nS).fill(0), avail = new Array(nS).fill(0), lost = new Array(nS).fill(0);
      const down = new Array(nS).fill(0), starve = new Array(nS).fill(0);
      let arrCnt = 0, arrM = 0, shipCnt = 0, shipM = 0;

      // 1. deliveries
      for (const po of pos) {
        if (!po.received && po.arrive === t) {
          po.received = true; onHand[po.item] += po.qty; onOrder[po.item] -= po.qty;
          if (po.arrive > po.eta) ev(t, 'warn', 'delay', `${ITEMS[po.item].name} delivery ${po.arrive - po.eta} day${po.arrive - po.eta > 1 ? 's' : ''} late (${po.id}, ${po.supplier})`);
        }
      }

      // 2. new orders
      if (!sunday) {
        const n = poisson(PARAMS.lambda * cfg.demand, R(seed, 11, t, 0));
        for (let k = 0; k < n; k++) {
          let u = R(seed, 12, t, k), acc = 0, p = PRODUCTS[PRODUCTS.length - 1];
          for (const pr of PRODUCTS) { acc += pr.share; if (u <= acc) { p = pr; break; } }
          const qty = Math.round((p.size[0] + R(seed, 13, t, k) * (p.size[1] - p.size[0])) / 100) * 100;
          const cust = CUSTOMERS[Math.floor(R(seed, 14, t, k) * CUSTOMERS.length)];
          const due = t + p.lead + Math.floor(R(seed, 15, t, k) * 7) - 2;
          const o = {
            n: ++soSeq, id: 'SO-' + soSeq, customer: cust, product: p.id, qty, arrival: t, due,
            release: null, start: [null, null, null, null], done: [null, null, null, null], ship: null,
            stage: -1, rem: 0, ready: 0, rawCost: 0, value: qty * p.price, blocked: 0
          };
          orders.push(o); arrCnt++; arrM += qty;
        }
      }

      // 3. release orders when every raw material is available
      const waiting = orders.filter(o => o.stage === -1).sort((a, b) => a.due - b.due || a.n - b.n);
      const blockedCount = new Array(nI).fill(0);
      for (const o of waiting) {
        const p = PRODUCTS.find(x => x.id === o.product);
        const need = {}; let ok = true;
        for (const id in p.bom) {
          need[id] = p.bom[id] * o.qty / 100;
          if (onHand[IDX[id]] + 1e-9 < need[id]) { ok = false; blockedCount[IDX[id]]++; short[IDX[id]] = 1; }
        }
        if (ok) {
          for (const id in need) { onHand[IDX[id]] -= need[id]; used[IDX[id]] += need[id]; o.rawCost += need[id] * ITEMS[IDX[id]].cost; }
          o.release = t; o.stage = 0; o.rem = o.qty; o.ready = t;
        } else o.blocked++;
      }
      for (let i = 0; i < nI; i++) {
        if (short[i] && !prevShort[i] && blockedCount[i] > 0) ev(t, 'crit', 'stockout', `${ITEMS[i].name} short: ${blockedCount[i]} order${blockedCount[i] > 1 ? 's' : ''} on hold for material`);
      }

      // 4. production, stage by stage
      for (let s = 0; s < nS; s++) {
        const S = STAGES[s], st = stg[s];
        let cap = 0;
        if (!sunday) {
          let isDown = false;
          if (st.down > 0) { st.down--; isDown = true; }
          else if (R(seed, 21, s, t) < cfg.breakdown) {
            st.down = Math.floor(R(seed, 22, s, t) * 3); isDown = true;
            ev(t, 'warn', 'breakdown', `${S.name} line breakdown, about ${st.down + 1} day${st.down ? 's' : ''} at reduced output`);
          }
          const eff = clamp(0.945 + 0.03 * normal(seed, 23, s, t), 0.85, 1);
          cap = S.cap * cfg.cap[S.id] * eff * (isDown ? 0.4 : 1);
          down[s] = isDown ? 1 : 0; avail[s] = cap;
        }
        const cons = ITEMS.filter(it => it.kind === 'cons' && it.stage === s);
        while (cap > 1) {
          const cands = orders.filter(o => o.stage === s && o.ready <= t && o.rem > 0.5);
          if (!cands.length) break;
          const o = pick(cands, cfg.rule, st.last, t);
          if (st.last !== null && o.product !== st.last) {
            const l = Math.min(S.changeover, cap); cap -= l; lost[s] += l; st.last = o.product;
            if (cap <= 1) break;
          } else if (st.last === null) st.last = o.product;
          let amt = Math.min(o.rem, cap), lim = Infinity, limItem = -1;
          for (const c of cons) { const mx = onHand[c.idx] / (c.rate / 100); if (mx < lim) { lim = mx; limItem = c.idx; } }
          if (lim < amt) { amt = lim; starve[s] = 1; short[limItem] = 1; }
          if (amt < 1) { starve[s] = 1; if (limItem >= 0) short[limItem] = 1; break; }
          for (const c of cons) { const q = amt * c.rate / 100; onHand[c.idx] -= q; used[c.idx] += q; cum.cons += q * c.cost; }
          cap -= amt; proc[s] += amt; o.rem -= amt;
          if (o.start[s] === null) o.start[s] = t;
          if (o.rem <= 0.5) {
            o.done[s] = t;
            if (s < nS - 1) { o.stage = s + 1; o.rem = o.qty; o.ready = t + 1; }
            else {
              o.stage = nS; o.rem = 0; o.ship = t; shipCnt++; shipM += o.qty;
              const conv = STAGES.reduce((a, x) => a + x.conv, 0) * o.qty;
              cum.rev += o.value; cum.cogs += o.rawCost + conv; cum.mat += o.rawCost; cum.conv += conv;
              if (t > o.due) {
                const pen = Math.min(PARAMS.latePenaltyCap, PARAMS.latePenaltyPerDay * (t - o.due)) * o.value; cum.pen += pen;
                ev(t, 'warn', 'late', `${o.id} (${o.customer}) shipped ${t - o.due} day${t - o.due > 1 ? 's' : ''} late`);
              }
            }
          }
        }
      }
      for (let s = 0; s < nS; s++) {
        if (starve[s]) {
          const it = ITEMS.find(x => x.kind === 'cons' && x.stage === s && short[x.idx]);
          if (it && !prevShort[it.idx]) ev(t, 'crit', 'starve', `${STAGES[s].name} slowed: ${it.name} ran out`);
        }
      }

      // 5. costs and replenishment
      cum.hold += invValue() * PARAMS.holdRate / 365;
      for (let i = 0; i < nI; i++) {
        const it = ITEMS[i], p = plan[i];
        if (onHand[i] + onOrder[i] <= p.rop) {
          const qty = Math.max(1, Math.ceil((p.S - onHand[i] - onOrder[i]) / it.lot)) * it.lot;
          const lt = Math.max(1, Math.round(it.lt[0] * cfg.supplierLT + it.lt[1] * normal(seed, 31, i, t)));
          const late = R(seed, 32, i, t) < cfg.lateProb ? 2 + Math.floor(R(seed, 33, i, t) * 5) : 0;
          let arrive = t + lt + late, eta = t + Math.round(it.lt[0]);
          if (isSunday(arrive)) arrive++;
          if (isSunday(eta)) eta++;
          const po = { id: 'PO-' + (++poSeq), item: i, supplier: it.supplier, qty, placed: t, eta, arrive, received: false, value: qty * it.cost };
          pos.push(po); onOrder[i] += qty; cum.ord += PARAMS.poFee;
          ev(t, 'info', 'po', `Raised ${po.id}: ${Math.round(qty).toLocaleString('en-IN')} ${it.unit} ${it.name}`);
        }
      }
      prevShort = short.slice();
      days.push(snapshot(t, { proc, avail, lost, down, starve, short, used, arrCnt, arrM, shipCnt, shipM }));
    }

    const sim = { cfg, plan, days, orders, pos, events, H, items: ITEMS, stages: STAGES, products: PRODUCTS, params: Object.assign({}, PARAMS) };
    return sim;
  }

  /* ---------- Metrics ---------- */
  function kpiAt(sim, d) {
    let recvN = 0, recvM = 0, shipN = 0, shipM = 0, awaitM = 0, prodM = 0, openN = 0, lateOpen = 0, elig = 0, ontime = 0, leadSum = 0, lateShip = 0, awaitN = 0;
    for (const o of sim.orders) {
      if (o.arrival <= d) {
        recvN++; recvM += o.qty;
        if (o.ship !== null && o.ship <= d) { shipN++; shipM += o.qty; leadSum += o.ship - o.arrival; if (o.ship > o.due) lateShip++; }
        else {
          openN++;
          if (o.release !== null && o.release <= d) prodM += o.qty; else { awaitM += o.qty; awaitN++; }
          if (o.due < d) lateOpen++;
        }
        if (o.due <= d) { elig++; if (o.ship !== null && o.ship <= o.due) ontime++; }
      }
    }
    const s = sim.days[d];
    let inv = 0, stockout = 0, usedVal = 0;
    for (let i = 1; i <= d; i++) {
      inv += sim.days[i].invValue; for (const f of sim.days[i].short) stockout += f;
      sim.days[i].used.forEach((q, j) => { usedVal += q * sim.items[j].cost; });
    }
    const util = sim.stages.map((st, si) => {
      let p = 0, work = 0;
      for (let i = 1; i <= d; i++) if (!sim.days[i].sunday) { p += sim.days[i].proc[si]; work++; }
      return work ? p / (st.cap * sim.cfg.cap[st.id] * work) : 0;
    });
    const utilAvail = sim.stages.map((st, si) => {
      let p = 0, a = 0;
      for (let i = 1; i <= d; i++) { p += sim.days[i].proc[si]; a += sim.days[i].avail[si]; }
      return a ? p / a : 0;
    });
    let bottleneck = -1, bu = 0; util.forEach((u, i) => { if (u > bu) { bu = u; bottleneck = i; } });
    const c = s.cum, avgInv = d ? inv / d : s.invValue;
    return {
      day: d, recvN, recvM, shipN, shipM, openN, awaitM, awaitN, prodM, lateOpen, lateShip,
      otif: elig ? ontime / elig * 100 : null, elig,
      lead: shipN ? leadSum / shipN : null,
      invValue: s.invValue, avgInv, stockoutDays: stockout,
      turns: d && avgInv > 0 ? usedVal / d * 365 / avgInv : null,
      throughput: d ? shipM / d : 0, utilAvail, bottleneck,
      costs: { materials: c.mat, conversion: c.conv, consumables: c.cons, holding: c.hold, ordering: c.ord, penalties: c.pen },
      revenue: c.rev, contribution: c.rev - c.cogs - c.cons - c.hold - c.ord - c.pen,
      penalties: c.pen, holding: c.hold, ordering: c.ord, util
    };
  }

  function buildSeries(sim) {
    const H = sim.H, out = { awaitM: [], prodM: [], otifRoll: [], recvCum: [], shipCum: [], util: [[], [], [], []], wip: [[], [], [], []], inv: [], invRaw: [], invCons: [] };
    let rc = 0, sc = 0;
    for (let d = 0; d <= H; d++) {
      const s = sim.days[d];
      out.awaitM.push(s.awaitM); out.prodM.push(s.bookProdM);
      rc += s.arrM; sc += s.shipM; out.recvCum.push(rc); out.shipCum.push(sc);

    for (let t = Math.ceil(d0); t <= d1; t++) if (t >= 1 && ((t - 1) % tickEvery === 0)) g += `<line class="gl" x1="${X(t)}" x2="${X(t)}" y1="${top - 4}" y2="${Hh - 6}"/><text class="ax" x="${X(t)}" y="12" text-anchor="middle">${dateShort(t)}</text>`;
    g += `<line class="mk" x1="${X(d + 1)}" x2="${X(d + 1)}" y1="${top - 4}" y2="${Hh - 6}"/>`;
    rows.forEach((o, r) => {
      const y = top + r * rh, cy = y + rh / 2;
      g += `<text class="ax" x="4" y="${cy + 4}" style="fill:var(--ink-2);font-family:var(--f-mono)">${W < 520 ? o.id.slice(3) : o.id + ' · ' + esc(prodOf(o.product).short)}</text>`;
      const relEnd = o.release !== null && o.release <= d ? o.release : d + 1;
      g += `<rect x="${X(o.arrival)}" y="${cy - 2}" width="${Math.max(1, X(relEnd) - X(o.arrival))}" height="4" rx="2" style="fill:${o.release !== null && o.release <= d ? 'var(--line)' : 'var(--c2)'};fill-opacity:${o.release !== null && o.release <= d ? 1 : .55}"/>`;
      for (let s = 0; s < 4; s++) {
        if (o.start[s] === null || o.start[s] > d) continue;
        const e = o.done[s] !== null && o.done[s] <= d ? o.done[s] + 1 : d + 1;
        g += `<rect x="${X(o.start[s])}" y="${cy - 7}" width="${Math.max(2, X(e) - X(o.start[s]) - 1)}" height="14" rx="3" style="fill:${SC[s]};fill-opacity:.92"><title>${STAGE_NAMES[s]}</title></rect>`;
      }
      if (o.due + 0.5 <= d1 && o.due + 0.5 >= d0) g += `<path d="M${X(o.due + 0.5)} ${y + 1} l4 5 h-8 z" style="fill:var(--ink)"><title>Due ${dateShort(o.due)}</title></path>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Order timeline by production stage">${g}</svg>`;
  }

  function tradeoff(host, pts, cur) {
    const W = Math.max(260, Math.floor(host.clientWidth || 640)), Hh = 250, m = { l: 48, r: 22, t: 14, b: 38 };
    const iw = W - m.l - m.r, ih = Hh - m.t - m.b;
    const xs = pts.map(p => p.avgInv), x0 = Math.min(...xs) * 0.94, x1 = Math.max(...xs) * 1.04;
    const ys = pts.map(p => p.otif), y0 = Math.max(0, Math.floor((Math.min(...ys) - 4) / 20) * 20), y1 = 100;
    const X = v => m.l + (v - x0) / (x1 - x0) * iw, Y = v => m.t + ih - (v - y0) / (y1 - y0) * ih;
    let g = '';
    for (let k = 0; k <= 4; k++) { const v = y0 + (y1 - y0) * k / 4, y = Y(v); g += `<line class="${k ? 'gl' : 'base'}" x1="${m.l}" x2="${W - m.r}" y1="${y}" y2="${y}"/><text class="ax" x="${m.l - 7}" y="${y + 4}" text-anchor="end">${Math.round(v)}%</text>`; }
    for (let k = 0; k <= 4; k++) { const v = x0 + (x1 - x0) * k / 4; g += `<text class="ax" x="${X(v)}" y="${Hh - 16}" text-anchor="middle">${inr(v)}</text>`; }
    g += `<text class="axb" x="${m.l + iw / 2}" y="${Hh - 1}" text-anchor="middle">Average stock held (more safety stock to the right)</text>`;
    let d = ''; pts.forEach((p, i) => { d += (i ? ' L' : 'M') + X(p.avgInv).toFixed(1) + ' ' + Y(p.otif).toFixed(1); });
    g += `<path d="${d}" style="fill:none;stroke:var(--c1);stroke-width:2;stroke-linejoin:round"/>`;
    pts.forEach(p => {
      const on = p.days === cur;
      g += `<circle cx="${X(p.avgInv)}" cy="${Y(p.otif)}" r="${on ? 6 : 4.5}" style="fill:${on ? 'var(--accent)' : 'var(--c1)'};stroke:var(--surface);stroke-width:2"><title>${p.days} days safety stock: ${n1(p.otif)}% on time, ${inr(p.avgInv)} average stock</title></circle>`;
      g += `<text class="ax" x="${X(p.avgInv)}" y="${Y(p.otif) - 10}" text-anchor="middle" style="${on ? 'font-weight:700;fill:var(--ink)' : ''}">${p.days}d</text>`;
    });
    host.innerHTML = `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="On-time delivery against stock held for different safety stock levels">${g}</svg>`;
  }

  /* ---------------- helpers for views ---------------- */
  const pill = (cls, t) => `<span class="pill ${cls}">${esc(t)}</span>`;
  const legend = arr => `<div class="legend">${arr.map(a => `<span><i style="background:${a[1]}"></i>${esc(a[0])}</span>`).join('')}</div>`;
  const setDay = d => { UI.day = clamp(Math.round(d), 0, UI.sim.H); renderScrub(); renderView(); };
  const pickDay = i => { stopPlay(); setDay(i); };
  const roll = (arr, w) => arr.map((v, i) => { let s = 0, c = 0; for (let j = Math.max(0, i - w + 1); j <= i; j++) if (arr[j] != null) { s += arr[j]; c++; } return v == null && i === 0 ? null : (c ? s / c : null); });
  function delta(v, b, o) {
    if (UI.isBase || v == null || b == null) return '';
    const d = v - b; if (Math.abs(d) < (o.eps || 0.05)) return `<span class="dl neu">= same as baseline</span>`;
    const good = o.neutral ? null : (o.higherBetter ? d > 0 : d < 0);
    return `<span class="dl ${good === null ? 'neu' : good ? 'good' : 'bad'}">${d > 0 ? '▲' : '▼'} ${o.fmt(Math.abs(d))} vs baseline</span>`;
  }

  /* ---------------- views ---------------- */
  function kpiTiles(kp, kb, compact) {
    const T = (l, v, s, dl) => `<div class="kpi"><label>${l}</label><div class="v">${v}</div><div class="s">${s}</div>${dl}</div>`;
    const tiles = {
      otif: T('On-time delivery', kp.otif == null ? 'n/a' : n1(kp.otif) + '%', kp.elig ? `${n0(kp.elig)} orders fell due` : 'No orders due yet', delta(kp.otif, kb.otif, { higherBetter: true, fmt: v => n1(v) + ' pts' })),
      shipped: T('Orders shipped', n0(kp.shipN), `of ${n0(kp.recvN)} received, ${n0(kp.openN)} open`, delta(kp.shipN, kb.shipN, { higherBetter: true, eps: 0.5, fmt: v => n0(v) })),
      book: T('Open order book', n0(kp.awaitM + kp.prodM) + ' m', `${n0(kp.awaitM)} m awaiting material`, delta(kp.awaitM + kp.prodM, kb.awaitM + kb.prodM, { eps: 100, fmt: v => n0(v) + ' m' })),
      lead: T('Avg lead time', kp.lead == null ? 'n/a' : n1(kp.lead) + ' d', `${n0(kp.lateOpen)} open orders overdue`, delta(kp.lead, kb.lead, { fmt: v => n1(v) + ' d' })),
      stock: T('Stock on hand', inr(kp.invValue), `${n0(kp.stockoutDays)} material-short item-days`, delta(kp.invValue, kb.invValue, { neutral: true, eps: 1000, fmt: v => inr(v) })),
      profit: T('Contribution', inr(kp.contribution), `on ${inr(kp.revenue)} shipped revenue`, delta(kp.contribution, kb.contribution, { higherBetter: true, eps: 1000, fmt: v => inr(v) })),
      thru: T('Throughput', n0(kp.throughput) + ' m/day', 'fabric shipped per calendar day', delta(kp.throughput, kb.throughput, { higherBetter: true, eps: 20, fmt: v => n0(v) + ' m/day' })),
      turns: T('Stock turns', kp.turns == null ? 'n/a' : n1(kp.turns) + ' /yr', 'yearly material use over average stock', delta(kp.turns, kb.turns, { higherBetter: true, eps: 0.1, fmt: v => n1(v) }))
    };
    const keys = compact ? ['otif', 'book', 'stock', 'profit'] : ['otif', 'shipped', 'book', 'lead', 'stock', 'profit', 'thru', 'turns'];
    return `<div class="kpis">` + keys.map(k => tiles[k]).join('') + `</div>`;
  }

  function flowHTML(d, kp) {
    const s = UI.sim.days[d], cfg = UI.sim.cfg;
    const qd = E.STAGES.map((st, i) => s.wip[i] / (st.cap * cfg.cap[st.id] * 0.93));
    let hot = -1, hv = 2; qd.forEach((v, i) => { if (v > hv) { hv = v; hot = i; } });
    let h = `<div class="flow">`;
    h += `<div class="cell"><div class="nm">Awaiting material</div><div class="big">${n0(s.awaitM)} <small>m</small></div><div class="sm">${n0(kp.awaitN)} orders on hold</div><div class="bar"><i style="width:${clamp(s.awaitM / 40000 * 100, 0, 100)}%;background:var(--c2)"></i></div>${kp.awaitN ? pill(kp.awaitN > 3 ? 'crit' : 'warn', 'On hold') : pill('good', 'Clear')}</div>`;
    E.STAGES.forEach((st, i) => {
      const nominal = st.cap * cfg.cap[st.id], util = d ? s.proc[i] / nominal * 100 : 0;
      let status;
      if (d === 0) status = pill('neu', 'Not started');
      else if (s.sunday) status = pill('neu', 'Weekly off');
      else if (s.down[i]) status = pill('crit', 'Breakdown');
      else if (s.starve[i]) { const it = E.ITEMS.find(x => x.kind === 'cons' && x.stage === i && s.short[x.idx]); status = pill('crit', 'Short of ' + (it ? it.name.toLowerCase() : 'supplies')); }
      else if (qd[i] > 3) status = pill('warn', `Queue ${n1(qd[i])} days`); else status = pill('good', 'Running');
      h += `<div class="cell${hot === i ? ' hot' : ''}"><div class="nm">${st.name}${hot === i ? '<em>Bottleneck</em>' : ''}</div><div class="big">${n0(s.wip[i])} <small>m queued</small></div><div class="sm">${s.sunday ? 'Closed today' : n0(util) + '% of capacity used today'}</div><div class="bar"><i style="width:${clamp(util, 0, 100)}%;background:${SC[i]}"></i></div>${status}</div>`;
    });
    h += `<div class="cell"><div class="nm">Shipped today</div><div class="big">${n0(s.shipM)} <small>m</small></div><div class="sm">${n0(s.shipCnt)} order${s.shipCnt === 1 ? '' : 's'} dispatched</div><div class="bar"><i style="width:${clamp(s.shipM / 12000 * 100, 0, 100)}%;background:var(--c3)"></i></div>${pill('info', n0(s.arrCnt) + ' new today')}</div>`;
    return h + `</div>`;
  }

  function viewOverview() {
    const d = UI.day, kp = E.kpiAt(UI.sim, d), kb = E.kpiAt(UI.base, d), ser = UI.ser, n = d + 1;
    const alerts = UI.sim.events.filter(e => e.day <= d && e.sev !== 'info').slice(-7).reverse();
    const html = `<div class="stack">
      ${kpiTiles(kp, kb, true)}
      <div class="card"><div class="card-h"><h3>Factory flow</h3><span class="sub">${dateStr(d)}${UI.sim.days[d].sunday ? ' · weekly off' : ''}</span></div>${flowHTML(d, kp)}</div>
      <div class="grid2">
        <div class="card"><div class="card-h"><h3>Open order book</h3>${legend([['In production', 'var(--c1)'], ['Awaiting material', 'var(--c2)']])}</div><div class="ch" id="chBook"></div><div class="sub" style="margin-top:6px">Meters of fabric ordered but not yet shipped. Click the chart to jump to a day.</div></div>
        <div class="card"><div class="card-h"><h3>On-time delivery</h3><span class="sub">orders due in the last 14 days</span></div><div class="ch" id="chOtif"></div></div>
      </div>
      <div class="card"><div class="card-h"><h3>Alerts</h3><span class="sub">up to ${dateStr(d)}</span></div>
        ${alerts.length ? `<ul class="feed">${alerts.map(e => `<li><time>${dateShort(e.day)}</time>${pill(e.sev === 'crit' ? 'crit' : 'warn', e.sev === 'crit' ? 'Critical' : 'Warning')}<span>${esc(e.text)}</span></li>`).join('')}</ul>` : '<div class="empty">Nothing to flag so far. Press play to run the days forward.</div>'}
      </div></div>`;
    return { html, after() {
      const x = { n, mark: d, xlab: dateShort, xtip: dateStr, onPick: pickDay };
      lineChart($('#chBook'), Object.assign({ series: [{ name: 'In production', color: 'var(--c1)', data: ser.prodM.slice(0, n) }, { name: 'Awaiting material', color: 'var(--c2)', data: ser.awaitM.slice(0, n) }], stack: true, yfmt: v => n0(v / 1000) + 'k', vfmt: v => n0(v) + ' m', aria: 'Open order book over time' }, x));
      lineChart($('#chOtif'), Object.assign({ series: [{ name: 'On-time %', color: 'var(--c1)', area: true, data: ser.otifRoll.slice(0, n) }], ymax: 100, yfmt: v => Math.round(v) + '%', vfmt: v => n1(v) + '%', ref: [{ y: 90, label: 'Target 90%' }], aria: 'Rolling on-time delivery' }, x));
    } };
  }

  function ordStatus(o, d) {
    if (o.ship !== null && o.ship <= d) return o.ship > o.due ? { k: 'late', l: 'Shipped late', c: 'warn' } : { k: 'ok', l: 'Shipped on time', c: 'good' };
    if (o.release === null || o.release > d) return { k: 'await', l: 'Awaiting material', c: d - o.arrival >= 2 ? 'crit' : 'warn', od: o.due < d };
    let s = 0; while (s < 3 && (o.done[s] === null || o.done[s] <= d)) s++;
    const started = o.start[s] !== null && o.start[s] <= d;
    return { k: 'prod', l: (started ? 'In ' : 'Queued · ') + E.STAGES[s].name.toLowerCase(), c: 'info', od: o.due < d, s };
  }
  function viewOrders() {
    const d = UI.day, sim = UI.sim;
    let list = sim.orders.filter(o => o.arrival <= d).map(o => ({ o, st: ordStatus(o, d) }));
    const cnt = k => list.filter(x => k === 'all' || x.st.k === k || (k === 'overdue' && x.st.od)).length;
    const F = [['all', 'All'], ['await', 'Awaiting material'], ['prod', 'In production'], ['overdue', 'Overdue'], ['ok', 'Shipped on time'], ['late', 'Shipped late']];
    const f = UI.oFilter, pf = UI.oProd;
    const shown = list.filter(x => (f === 'all' || x.st.k === f || (f === 'overdue' && x.st.od)) && (pf === 'all' || x.o.product === pf)).sort((a, b) => b.o.arrival - a.o.arrival || b.o.n - a.o.n);
    const rows = shown.slice(0, 80).map(({ o, st }) => {
      const dots = [0, 1, 2, 3].map(s => `<i style="${o.done[s] !== null && o.done[s] <= d ? 'background:' + SC[s] : ''}" class="${st.s === s ? 'cur' : ''}" title="${STAGE_NAMES[s]}"></i>`).join('');
      const slack = (o.ship !== null && o.ship <= d) ? (o.due - o.ship >= 0 ? `${o.due - o.ship} d early` : `${o.ship - o.due} d late`) : (o.due >= d ? `due in ${o.due - d} d` : `${d - o.due} d overdue`);
      return `<tr><td class="id">${o.id}</td><td>${esc(o.customer)}</td><td>${esc(prodOf(o.product).name)}</td><td class="n">${n0(o.qty)}</td><td>${dateShort(o.arrival)}</td><td>${dateShort(o.due)}</td><td>${pill(st.c, st.l)}${st.od ? ' ' + pill('crit', 'Overdue') : ''}</td><td><span class="dots">${dots}</span></td><td class="n">${slack}</td></tr>`;
    }).join('');
    const html = `<div class="stack">
      <div class="grid2">
        <div class="card"><div class="card-h"><h3>Received vs shipped</h3>${legend([['Received', 'var(--c1)'], ['Shipped', 'var(--c3)']])}</div><div class="ch" id="chFlow"></div><div class="sub" style="margin-top:6px">The gap between the lines is the open order book.</div></div>
        <div class="card"><div class="card-h"><h3>Lead time of shipped orders</h3><span class="sub">days from receipt to dispatch</span></div><div class="ch" id="chLead"></div></div>
      </div>
      <div class="card"><div class="card-h"><h3>Order book</h3><span class="sub">${n0(list.length)} orders received by ${dateStr(d)}</span></div>
        <div class="chips">${F.map(([k, l]) => `<button class="chip" data-ofilter="${k}" aria-pressed="${f === k}">${l} · ${cnt(k)}</button>`).join('')}
          <select class="sel" id="oProd" style="width:auto;margin-left:auto" aria-label="Filter by product"><option value="all">All products</option>${E.PRODUCTS.map(p => `<option value="${p.id}"${pf === p.id ? ' selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
        <div class="tbl tall"><table><thead><tr><th>Order</th><th>Customer</th><th>Product</th><th class="n">Meters</th><th>Received</th><th>Due</th><th>Status</th><th>Stages</th><th class="n">Timing</th></tr></thead><tbody>${rows || '<tr><td colspan="9" class="empty">No orders match this filter yet.</td></tr>'}</tbody></table></div>
        <div class="sub" style="margin-top:8px">${shown.length > 80 ? 'Showing the 80 most recent of ' + shown.length + '. ' : ''}Stage squares fill as weaving, dyeing, finishing and packing complete; the outlined square is where the order sits now.</div>
      </div></div>`;
    return { html, after() {
      const n = d + 1;
      lineChart($('#chFlow'), { n, mark: d, xlab: dateShort, xtip: dateStr, onPick: pickDay, series: [{ name: 'Received', color: 'var(--c1)', data: UI.ser.recvCum.slice(0, n) }, { name: 'Shipped', color: 'var(--c3)', data: UI.ser.shipCum.slice(0, n) }], yfmt: v => n0(v / 1000) + 'k', vfmt: v => n0(v) + ' m', aria: 'Cumulative meters received and shipped' });
      const leads = sim.orders.filter(o => o.ship !== null && o.ship <= d).map(o => o.ship - o.arrival);
      const bins = new Array(10).fill(0); leads.forEach(l => bins[Math.min(9, Math.floor(l / 2))]++);
      barChart($('#chLead'), { values: bins, labels: bins.map((_, i) => i === 9 ? '18+' : (i * 2) + '-' + (i * 2 + 1)), every: 1, color: () => 'var(--c1)', aria: 'Distribution of order lead times' });
    } };
  }

  function viewProduction() {
    const d = UI.day, sim = UI.sim, cfg = sim.cfg, ser = UI.ser, n = d + 1, kp = E.kpiAt(sim, d);
    const sched = sim.orders.filter(o => o.arrival <= d && (o.ship === null || o.ship > d - 3) && o.release !== null && o.release <= d || (o.arrival <= d && o.ship === null))
      .sort((a, b) => a.due - b.due || a.n - b.n).slice(0, 12);
    const stageCards = E.STAGES.map((st, i) => {
      let down = 0, starve = 0, lost = 0;
      for (let t = 1; t <= d; t++) { down += sim.days[t].down[i]; starve += sim.days[t].starve[i]; lost += sim.days[t].lost[i]; }
      const nominal = st.cap * cfg.cap[st.id], wip = sim.days[d].wip[i], qd = wip / (nominal * 0.93);
      return `<div class="stage"><h4><i style="background:${SC[i]}"></i>${st.name}</h4>
        <div class="bar" style="margin-top:10px"><i style="width:${clamp(kp.util[i] * 100, 0, 100)}%;background:${SC[i]}"></i></div>
        <dl><dt>Capacity</dt><dd>${n0(nominal)} m/day</dd><dt>Utilisation (of nominal)</dt><dd>${n0(kp.util[i] * 100)}%</dd><dt>Load when running</dt><dd>${n0(kp.utilAvail[i] * 100)}%</dd><dt>Queue</dt><dd>${n0(wip)} m</dd><dt>Queue length</dt><dd>${n1(qd)} days</dd><dt>Breakdown days</dt><dd>${n0(down)}</dd><dt>Changeover loss</dt><dd>${n0(lost)} m</dd><dt>Supply-short days</dt><dd>${n0(starve)}</dd></dl></div>`;
    }).join('');
    const rule = { edd: 'Earliest due date first', fifo: 'First in, first out', campaign: 'Campaign by product' }[cfg.rule];
    const html = `<div class="stack">
      <div class="stages">${stageCards}</div>
      <div class="grid2">
        <div class="card"><div class="card-h"><h3>Utilisation by stage</h3><span class="sub">7-day average</span></div>${legend(E.STAGES.map((s, i) => [s.name, SC[i]]))}<div class="ch" id="chUtil" style="margin-top:8px"></div></div>
        <div class="card"><div class="card-h"><h3>Work waiting at each stage</h3></div>${legend(E.STAGES.map((s, i) => [s.name, SC[i]]))}<div class="ch" id="chWip" style="margin-top:8px"></div></div>
      </div>
      <div class="card"><div class="card-h"><h3>Shop-floor timeline</h3><span class="sub">Sequencing rule: ${rule}. Triangle marks the due date.</span></div>
        ${legend([['Weaving', SC[0]], ['Dyeing', SC[1]], ['Finishing', SC[2]], ['Packing', SC[3]], ['Waiting for material', 'var(--c2)']])}
        <div class="ch" id="chGantt" style="margin-top:8px"></div>
        ${sched.length ? '' : '<div class="empty">No orders in flight yet.</div>'}
      </div></div>`;
    return { html, after() {
      const x = { n, mark: d, xlab: dateShort, xtip: dateStr, onPick: pickDay };
      lineChart($('#chUtil'), Object.assign({ series: E.STAGES.map((s, i) => ({ name: s.name, color: SC[i], data: roll(ser.util[i], 7).slice(0, n) })), ymax: 100, yfmt: v => Math.round(v) + '%', vfmt: v => n0(v) + '%', ref: [{ y: 100, label: '' }], aria: 'Utilisation by stage' }, x));
      lineChart($('#chWip'), Object.assign({ series: E.STAGES.map((s, i) => ({ name: s.name, color: SC[i], data: ser.wip[i].slice(0, n) })), stack: true, yfmt: v => n0(v / 1000) + 'k', vfmt: v => n0(v) + ' m', aria: 'Meters waiting at each stage' }, x));
      if (sched.length) gantt($('#chGantt'), sched, d);
    } };
  }

  function viewInventory() {
    const d = UI.day, sim = UI.sim, s = sim.days[d], ser = UI.ser, n = d + 1;
    const rows = [];
    let below = 0, short = 0, rawValue = 0, consValue = 0;
    ['raw', 'cons'].forEach(kind => {
      rows.push(`<tr class="grp"><td colspan="7">${kind === 'raw' ? 'Raw materials' : 'Consumables'}</td></tr>`);
      E.ITEMS.filter(it => it.kind === kind).forEach(it => {
        const i = it.idx, plan = sim.plan[i], oh = s.onHand[i];
        let use = 0, c = 0; for (let t = Math.max(1, d - 6); t <= d; t++) { use += sim.days[t].used[i]; c++; }
        use = c ? use / c : 0; const cover = use > 0 ? oh / use : null;
        const isShort = d > 0 && (s.short[i] || oh < 1);
        let st; if (isShort) { st = pill('crit', 'Short'); short++; } else if (oh < plan.rop) { st = s.onOrder[i] > 0 ? pill('info', 'On order') : pill('warn', 'Below reorder'); below++; } else st = pill('good', 'OK');
        const hist = []; for (let t = Math.max(0, d - 29); t <= d; t++) hist.push(sim.days[t].onHand[i]);
        if (kind === 'raw') rawValue += oh * it.cost; else consValue += oh * it.cost;
        rows.push(`<tr><td>${esc(it.name)}</td><td class="n">${n0(oh)} ${it.unit}</td><td class="n">${cover == null ? '-' : n1(cover) + ' d'}</td><td class="n">${n0(plan.rop)}</td><td class="n">${n0(s.onOrder[i])}</td><td>${st}</td><td>${spark(hist, plan.rop, isShort ? 'var(--crit)' : 'var(--c1)')}</td></tr>`);
      });
    });
    const T = (l, v, sub) => `<div class="kpi"><label>${l}</label><div class="v">${v}</div><div class="s">${sub}</div></div>`;
    const html = `<div class="stack">
      <div class="kpis">${T('Stock value', inr(s.invValue), `raw ${inr(rawValue)}, consumables ${inr(consValue)}`)}${T('Items short', n0(short), 'blocking orders or a stage today')}${T('At or below reorder point', n0(below), 'replenishment under way or due')}${T('Purchase orders open', n0(sim.pos.filter(p => p.placed <= d && !(p.arrive <= d)).length), inr(sim.pos.filter(p => p.placed <= d && !(p.arrive <= d)).reduce((a, p) => a + p.value, 0)) + ' on order')}</div>
      <div class="card"><div class="card-h"><h3>Stock position</h3><span class="sub">${dateStr(d)}. Sparkline shows the last 30 days; the dashed line is the reorder point.</span></div>
        <div class="tbl"><table><thead><tr><th>Item</th><th class="n">On hand</th><th class="n">Cover</th><th class="n">Reorder point</th><th class="n">On order</th><th>Status</th><th>Last 30 days</th></tr></thead><tbody>${rows.join('')}</tbody></table></div></div>
      <div class="card"><div class="card-h"><h3>Stock value over time</h3>${legend([['Raw materials', 'var(--c1)'], ['Consumables', 'var(--c3)']])}</div><div class="ch" id="chInv"></div></div></div>`;
    return { html, after() {
      lineChart($('#chInv'), { n, mark: d, xlab: dateShort, xtip: dateStr, onPick: pickDay, stack: true, series: [{ name: 'Raw materials', color: 'var(--c1)', data: ser.invRaw.slice(0, n) }, { name: 'Consumables', color: 'var(--c3)', data: ser.invCons.slice(0, n) }], yfmt: v => '₹' + n0(v / 1e5) + ' L', vfmt: v => inr(v), ml: 62, aria: 'Stock value over time' });
    } };
  }

  function viewProcurement() {
    const d = UI.day, sim = UI.sim;
    const all = sim.pos.filter(p => p.placed <= d);
    const st = p => p.arrive <= d ? (p.arrive > p.eta ? { k: 'late', l: `Received ${p.arrive - p.eta} d late`, c: 'warn' } : { k: 'ok', l: 'Received on time', c: 'good' })
      : (d > p.eta ? { k: 'over', l: 'Overdue', c: 'crit' } : { k: 'open', l: 'In transit', c: 'info' });
    const withSt = all.map(p => ({ p, s: st(p) }));
    const recv = withSt.filter(x => x.p.arrive <= d), onTime = recv.filter(x => x.s.k === 'ok').length;
    const openV = withSt.filter(x => x.p.arrive > d).reduce((a, x) => a + x.p.value, 0);
    const f = UI.poFilter;
    const match = x => f === 'all' || (f === 'open' && x.p.arrive > d) || (f === 'late' && (x.s.k === 'late' || x.s.k === 'over'));

    const html = `<div class="stack">
      <div class="kpis">${T('Purchase orders raised', n0(all.length), `${inr(all.length * E.PARAMS.poFee)} ordering cost`)}${T('Received', n0(recv.length), inr(recv.reduce((a, x) => a + x.p.value, 0)) + ' of material')}${T('Supplier on-time rate', recv.length ? n0(onTime / recv.length * 100) + '%' : 'n/a', 'received on or before the promised date')}${T('Still on order', inr(openV), n0(withSt.filter(x => x.p.arrive > d).length) + ' purchase orders')}</div>
      <div class="card"><div class="card-h"><h3>Purchase orders</h3><span class="sub">Raised automatically when stock on hand plus on order drops to the reorder point</span></div>
        <div class="chips">${[['all', 'All'], ['open', 'Open'], ['late', 'Late or overdue']].map(([k, l]) => `<button class="chip" data-pofilter="${k}" aria-pressed="${f === k}">${l}</button>`).join('')}</div>
        <div class="tbl tall"><table><thead><tr><th>PO</th><th>Item</th><th>Supplier</th><th class="n">Quantity</th><th>Raised</th><th>Promised</th><th>Arrival</th><th>Status</th><th class="n">Value</th></tr></thead><tbody>${rows || '<tr><td colspan="9" class="empty">No purchase orders match yet.</td></tr>'}</tbody></table></div>
        ${shown.length > 80 ? `<div class="sub" style="margin-top:8px">Showing the 80 most recent of ${shown.length}.</div>` : ''}
      </div></div>`;

  }

  function runCompare() {
    const key = cmpKey();
    if (UI.cmp.key === key && UI.cmp.data) return;
    if (UI.cmp.busy && UI.cmp.pending === key) return;
    UI.cmp.busy = true; UI.cmp.pending = key;
    setTimeout(() => {
      const base = { horizon: UI.cfg.horizon, seed: UI.cfg.seed };
      const reps = 16, rows = E.PRESETS.map(p => ({ name: p.name, r: E.runMany(E.presetCfg(p.id, Object.assign({}, E.DEFAULTS, base)), reps) }));
      const mine = { name: 'Your current settings', r: E.runMany(UI.cfg, reps), mine: true };
      const pts = [0, 2, 4, 6, 8, 10, 12].map(dd => { const r = E.runMany(Object.assign({}, UI.cfg, { safetyDays: dd }), 12); return { days: dd, otif: r.otif, avgInv: r.avgInv }; });
      UI.cmp = { key, data: { rows: rows.concat([mine]), pts, reps }, busy: false };
      if (UI.tab === 'compare') renderView();
    }, 40);
  }
  function viewCompare() {
    runCompare();
    if (!UI.cmp.data || UI.cmp.key !== cmpKey()) {
      return { html: `<div class="card"><div class="loading">Running ${E.PRESETS.length + 1} scenarios with 16 simulated runs each...</div></div>`, after() {} };
    }
    const { rows, pts, reps } = UI.cmp.data;
    const cols = [
      { k: 'otif', l: 'On-time', f: v => v == null ? 'n/a' : n1(v) + '%', hb: true, bar: v => v, rng: r => r.otifP10 == null ? '' : `${n0(r.otifP10)}-${n0(r.otifP90)}%` },
      { k: 'lead', l: 'Avg lead time', f: v => v == null ? 'n/a' : n1(v) + ' d', hb: false },
      { k: 'openM', l: 'Open book at end', f: v => n0(v) + ' m', hb: false },
      { k: 'lateOpen', l: 'Overdue open', f: v => n1(v), hb: false },
      { k: 'stockoutDays', l: 'Short item-days', f: v => n0(v), hb: false },
      { k: 'avgInv', l: 'Avg stock', f: v => inr(v), hb: false },
      { k: 'contribution', l: 'Contribution', f: v => inr(v), hb: true, rng: r => `${inr(r.contributionP10)} to ${inr(r.contributionP90)}` },
      { k: 'turns', l: 'Stock turns / yr', f: v => v == null ? 'n/a' : n1(v), hb: true }
    ];
    const best = {}; cols.forEach(c => { const vals = rows.map(r => r.r[c.k]).filter(v => v != null); best[c.k] = c.hb ? Math.max(...vals) : Math.min(...vals); });
    const tr = rows.map(r => `<tr${r.mine ? ' style="background:var(--accent-soft)"' : ''}><td style="font-weight:${r.mine ? 700 : 550}">${esc(r.name)}</td>${cols.map(c => { const v = r.r[c.k]; const isBest = v != null && v === best[c.k]; return `<td class="n ${isBest ? 'best' : ''}">${c.bar && v != null ? `<span class="mini"><i style="width:${clamp(v, 0, 100)}%"></i></span>` : ''}${c.f(v)}${isBest ? ' ✓' : ''}${c.rng && v != null ? `<div class="rng">${c.rng(r.r)}</div>` : ''}</td>`; }).join('')}</tr>`).join('');
    const html = `<div class="stack">
      <div class="card"><div class="card-h"><h3>Scenario comparison</h3><span class="sub">Average of ${reps} simulated runs of ${UI.cfg.horizon} days each. ✓ marks the best value in a column. Smaller grey figures show the middle 80% of runs (10th to 90th percentile).</span></div>
        <div class="tbl"><table class="cmp"><thead><tr><th>Scenario</th>${cols.map(c => `<th class="n">${c.l}</th>`).join('')}</tr></thead><tbody>${tr}</tbody></table></div>
        <div class="note">Every scenario sees the same customer orders and machine luck, so differences come from the settings. Averages smooth out one-off bad weeks that a single run can show.</div></div>
      <div class="card"><div class="card-h"><h3>How much safety stock is enough?</h3><span class="sub">Uses your current settings</span></div><div class="ch" id="chTrade"></div>
        <div class="note">Each point is a safety stock level in days of cover. Service improves quickly at first, then flattens while the cost of holding stock keeps rising.</div></div></div>`;
    return { html, after() { tradeoff($('#chTrade'), pts, UI.cfg.safetyDays); } };
  }

  /* ---------------- report ---------------- */
  function scenarioName() {
    for (const p of E.PRESETS) {
      const pc = E.presetCfg(p.id, Object.assign({}, E.DEFAULTS, { horizon: UI.cfg.horizon, seed: UI.cfg.seed }));
      pc.cap = Object.assign({}, E.DEFAULTS.cap, pc.cap);
      if (sameSettings(UI.cfg, pc)) return p.name;
    }
    return 'Custom scenario';
  }

  function findings(sim, kp, d) {
    const out = [], P = E.PARAMS;
    if (d < 7) return [{ sev: 'neu', head: 'Too early to judge', text: 'Move the day slider forward (or press play) so that orders have had time to flow through the plant.' }];
    if (kp.otif == null) out.push({ sev: 'neu', head: 'Service', text: 'No orders have fallen due yet.' });
    else out.push({ sev: kp.otif >= 95 ? 'good' : kp.otif >= 90 ? 'warn' : 'crit', head: 'Service level',
      text: `${n1(kp.otif)}% of the ${n0(kp.elig)} orders that fell due were shipped on or before their due date (target 90%). ${n0(kp.lateOpen)} open orders are already overdue and ${n0(kp.lateShip)} shipped late.` });
    if (kp.bottleneck >= 0) {
      const st = E.STAGES[kp.bottleneck], nominal = st.cap * sim.cfg.cap[st.id], q = sim.days[d].wip[kp.bottleneck] / (nominal * 0.93), u = kp.util[kp.bottleneck] * 100;
      out.push({ sev: u > 90 || q > 4 ? 'crit' : u > 80 || q > 2.5 ? 'warn' : 'good', head: 'Bottleneck: ' + st.name,
        text: `${st.name} ran at ${n0(u)}% of nominal capacity and holds ${n0(sim.days[d].wip[kp.bottleneck])} m of queued work (${n1(q)} days of output). ${u > 85 ? 'Any extra demand lands here first.' : 'There is headroom at the moment.'}` });
    }
    const shortDays = E.ITEMS.map(it => { let n = 0; for (let t = 1; t <= d; t++) n += sim.days[t].short[it.idx]; return { it, n }; }).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
    if (shortDays.length) {
      const top = shortDays[0], held = sim.orders.filter(o => o.arrival <= d && o.blocked > 0).length;
      out.push({ sev: top.n > d * 0.2 ? 'crit' : 'warn', head: 'Material shortages',
        text: `${top.it.name} was short on ${n0(top.n)} of ${d} days${shortDays.length > 1 ? ', followed by ' + shortDays.slice(1, 3).map(x => x.it.name + ' (' + x.n + ')').join(' and ') : ''}. ${n0(held)} orders have been held at least one day waiting for material.` });
    } else out.push({ sev: 'good', head: 'Material availability', text: 'No material shortages so far.' });
    const recv = sim.pos.filter(p => p.arrive <= d);
    if (recv.length) {
      const by = {}; recv.forEach(p => { const b = by[p.supplier] || (by[p.supplier] = { n: 0, late: 0, days: 0 }); b.n++; if (p.arrive > p.eta) { b.late++; b.days += p.arrive - p.eta; } });
      const rows = Object.entries(by).map(([k, b]) => ({ k, ...b, rate: 1 - b.late / b.n })).sort((a, b) => a.rate - b.rate);
      const tot = recv.filter(p => p.arrive <= p.eta).length / recv.length * 100;
      out.push({ sev: tot >= 90 ? 'good' : tot >= 75 ? 'warn' : 'crit', head: 'Supplier reliability',
        text: `${n0(tot)}% of ${recv.length} deliveries arrived on or before the promised date. Weakest: ${rows[0].k} (${n0(rows[0].rate * 100)}% on time, ${rows[0].n - rows[0].late} of ${rows[0].n} deliveries${rows[0].late ? ', ' + n1(rows[0].days / rows[0].late) + ' days late on average when late' : ''}).` });
    }
    const margin = kp.revenue ? kp.contribution / kp.revenue * 100 : 0;
    const big = Object.entries(kp.costs).sort((a, b) => b[1] - a[1])[0];
    out.push({ sev: margin > 20 ? 'good' : margin > 10 ? 'warn' : 'crit', head: 'Profitability',
      text: `Contribution of ${inr(kp.contribution)} on ${inr(kp.revenue)} shipped revenue (${n1(margin)}% margin). Late-delivery penalties cost ${inr(kp.penalties)}; the largest cost is ${big[0]} at ${inr(big[1])}.` });
    if (kp.turns != null) out.push({ sev: 'neu', head: 'Working capital', text: `Average stock of ${inr(kp.avgInv)} turns ${n1(kp.turns)} times a year. Carrying it costs about ${inr(kp.avgInv * P.holdRate)} a year at ${n0(P.holdRate * 100)}%.` });
    return out;
  }

  function runLevers() {
    const key = cmpKey();
    if (UI.lev.key === key && UI.lev.data) return;
    if (UI.lev.busy && UI.lev.pending === key) return;
    UI.lev.busy = true; UI.lev.pending = key;
    setTimeout(() => {
      const reps = 12, cur = UI.cfg, kp = E.kpiAt(UI.sim, UI.sim.H), bn = kp.bottleneck >= 0 ? E.STAGES[kp.bottleneck] : E.STAGES[1];
      const withCap = Object.assign({}, cur, { cap: Object.assign({}, cur.cap, { [bn.id]: cur.cap[bn.id] * 1.1 }) });
      const defs = [
        { name: `${bn.name} capacity +10%`, cfg: withCap },
        { name: 'Safety stock +2 days', cfg: Object.assign({}, cur, { safetyDays: cur.safetyDays + 2 }) },
        { name: 'Campaign sequencing', cfg: Object.assign({}, cur, { rule: 'campaign' }), skip: cur.rule === 'campaign' },
        { name: 'Breakdowns halved', cfg: Object.assign({}, cur, { breakdown: cur.breakdown / 2 }) },
        { name: 'Late deliveries halved', cfg: Object.assign({}, cur, { lateProb: cur.lateProb / 2 }) }
      ].filter(x => !x.skip);
      const base = E.runMany(cur, reps);
      const rows = defs.map(x => ({ name: x.name, r: E.runMany(x.cfg, reps) }));
      UI.lev = { key, data: { base, rows, reps }, busy: false };
      if (UI.tab === 'report') renderView();
    }, 40);
  }

  function ordersCsv() {

      const st = ordStatus(o, H), late = o.ship !== null ? Math.max(0, o.ship - o.due) : Math.max(0, H - o.due);
      return [o.id, o.customer, prodOf(o.product).name, o.qty, iso(o.arrival), iso(o.due), iso(o.release || 0), iso(o.ship || 0), st.l, late, Math.round(o.value)];
    })));

    const sim = UI.sim;

  function dailyCsv() {
    const sim = UI.sim, head = ['Day', 'Date', 'Meters received', 'Meters shipped', 'Orders received', 'Orders shipped', 'Awaiting material (m)', 'Stock value INR'];
    sim.stages.forEach(s => head.push(s.name + ' processed (m)', s.name + ' queue (m)'));
    sim.items.forEach(i => head.push(i.name + ' on hand (' + i.unit + ')'));
    return csv([head].concat(sim.days.slice(1).map((s, k) => {
      const row = [k + 1, iso(k + 1), Math.round(s.arrM), Math.round(s.shipM), s.arrCnt, s.shipCnt, Math.round(s.awaitM), Math.round(s.invValue)];
      sim.stages.forEach((_, i) => row.push(Math.round(s.proc[i]), Math.round(s.wip[i])));
      s.onHand.forEach(q => row.push(Math.round(q * 10) / 10));
      return row;
    })));
  }
  function saveScenario() {
    download('loomline-scenario.json', JSON.stringify({ app: 'loomline', version: 1, savedAt: new Date().toISOString(), settings: UI.cfg, data: E.getData() }, null, 2), 'application/json');

        <div class="note">Average of ${lev.reps} runs per row, same demand and machine luck throughout. On-time differences under about 2 points are within normal run-to-run noise (current settings: standard deviation ${n1(lev.base.otifSd)} pts).</div>`

    const pill2 = f => pill(f.sev, { good: 'On track', warn: 'Watch', crit: 'Act', neu: 'Info' }[f.sev]);
    const set = [['Scenario', scenarioName()], ['Run', `${sim.H} days, seed ${UI.cfg.seed}`], ['Customer demand', Math.round(UI.cfg.demand * 100) + '% of plan'], ['Supplier lead time', Math.round(UI.cfg.supplierLT * 100) + '% of normal, ' + Math.round(UI.cfg.lateProb * 100) + '% late'],
      ['Safety stock', UI.cfg.safetyDays + ' days'], ['Breakdowns', Math.round(UI.cfg.breakdown * 100) + '% per line per day'], ['Capacity', E.STAGES.map(s => s.name + ' ' + Math.round(UI.cfg.cap[s.id] * 100) + '%').join(', ')],

    const html = `<div class="stack report">

      <div class="grid2">

          ${costRow('Shipped revenue', kp.revenue)}${costRow('Materials', c.materials)}${costRow('Conversion (labour, energy, overhead)', c.conversion)}${costRow('Consumables', c.consumables)}${costRow('Stock holding', c.holding)}${costRow('Purchase order handling', c.ordering)}${costRow('Late-delivery penalties', c.penalties)}${costRow('Contribution', kp.contribution, 'tot')}</tbody></table></div></div>
        <div class="card"><div class="card-h"><h3>Settings used</h3></div><div class="tbl"><table class="wrapc"><tbody>${set.map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</tbody></table></div></div>
      </div>
      <div class="card"><div class="card-h"><h3>Where to improve</h3><span class="sub">Each change tested on its own against your current settings</span></div>${levHtml}</div>
